<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .container{
      background: #000f;
      width: 100%;
      height: 100vh;
      align-items: center;
      display: flex;
      justify-content: center;
      color: white;
      gap: 30px;
    }
    .left, .right{
      width: 300px;
      height: 300px;
      border: 3px dashed crimson;
      padding: 10px;
    }
    .list{
      background: crimson;
      margin: 12px;
      padding: 20px;
      cursor: grab;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="list" draggable="true">
        List Number 1
      </div>
      <div class="list" draggable="true">
        List Number 2
      </div>
      <div class="list" draggable="true">
        List Number 3
      </div>
      <div class="list" draggable="true">
        List Number 4
      </div>
    </div>
    <div class="right"></div>
  </div>

  <script>
    let lists = document.querySelectorAll(".list");
    let left = document.querySelector(".left");
    let right = document.querySelector(".right");

    // Enable drag functionality within the same container and across containers
    lists.forEach(list => {
      list.addEventListener("dragstart", (e) => {
        let selected = e.target;

        // Allow dragging between the containers
        left.addEventListener("dragover", (e) => {
          e.preventDefault(); // Allow dropping
        });

        right.addEventListener("dragover", (e) => {
          e.preventDefault(); // Allow dropping
        });

        left.addEventListener("drop", (e) => {
          e.preventDefault();
          // Move the item to the left container
          if (!left.contains(selected)) {
            let afterElement = getDragAfterElement(left, e.clientY);
            if (afterElement == null) {
              left.appendChild(selected);
            } else {
              left.insertBefore(selected, afterElement);
            }
          }
        });

        right.addEventListener("drop", (e) => {
          e.preventDefault();
          // Move the item to the right container
          if (!right.contains(selected)) {
            let afterElement = getDragAfterElement(right, e.clientY);
            if (afterElement == null) {
              right.appendChild(selected);
            } else {
              right.insertBefore(selected, afterElement);
            }
          }
        });
      });
    });

    // Function to determine the position where the dragged element should be inserted
    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.list:not(.dragging)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }
  </script>
</body>
</html>
